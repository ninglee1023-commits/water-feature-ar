<canvas id="c"></canvas>
<div id="start">
  <h1>會所入口水景 · AR 對位</h1>
  <p>用 D505 Rev B 模型對準現場花槽。<br>需要 Android 手機 + Chrome（支援 ARCore）。iPhone 的 Safari 暫不支援 WebXR AR，只能看 3D 預覽。</p>
  <p class="small">對位方法：對準花槽<b>同一條長邊的牆腳</b>點兩下，再對準<b>左邊短邊的牆腳</b>點一下。圓角位置不用點，程式會自動求出角位。</p>
  <button id="startBtn" class="pri">開始 AR</button>
  <button id="previewBtn">只看 3D 預覽</button>
  <div id="support" class="small"></div>
</div>
<div id="ui" class="hide">
  <div id="cross"></div>
  <div id="top" class="card">
    <div id="step">移動手機掃描地面…</div>
    <div id="sub"></div>
    <div id="meas"></div>
  </div>
  <div id="bottom" class="card">
    <div class="row">
      <label>對位面
        <select id="face">
          <option value="S">長邊・近噴泉一面（預設）</option>
          <option value="N">長邊・近景觀牆一面</option>
          <option value="W">短邊・西面</option>
          <option value="E">短邊・東面</option>
        </select>
      </label>
      <label>點擊地面標高
        <select id="lvl">
          <option value="14.80">BL +14.80（未鋪石）</option>
          <option value="14.75">SFL +14.75</option>
          <option value="15.15">FL +15.15（已鋪石）</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="tapBtn" class="pri">＋ 記錄此點</button>
      <button id="undoBtn">復原</button>
      <button id="resetBtn" class="warn">重新對位</button>
    </div>
    <div id="fine" class="hide">
      <div class="row small">微調（相對所選牆面）步距
        <select id="stepSize"><option value="0.005">5 mm</option><option value="0.01" selected>10 mm</option><option value="0.05">50 mm</option><option value="0.2">200 mm</option></select>
        轉角 <select id="angSize"><option value="0.1">0.1°</option><option value="0.5" selected>0.5°</option><option value="2">2°</option></select>
      </div>
      <div class="grid">
        <button data-n="L">◀ 左</button><button data-n="R">右 ▶</button><button data-n="F">向外</button><button data-n="B">向內</button>
        <button data-n="U">▲ 升</button><button data-n="D">▼ 降</button><button data-n="CCW">⟲ 轉</button><button data-n="CW">⟳ 轉</button>
      </div>
      <div class="row small" id="offs"></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="gPlanter" checked>花槽＋托盤</label>
      <label><input type="checkbox" id="gPool" checked>池邊＋池底</label>
      <label><input type="checkbox" id="gWater">水體</label>
      <label><input type="checkbox" id="gWalls">景觀牆</label>
      <label><input type="checkbox" id="gCtx">周邊花槽／樹</label>
    </div>
    <div class="row"><label style="flex:1">透明度 <input type="range" id="op" min="10" max="100" value="55"></label>
      <label><input type="checkbox" id="edges" checked>輪廓線</label></div>
    <div class="row"><button id="exitBtn">結束</button><span class="small">輸出：D505 Rev B v01；平面比例按 680 mm 噴泉間距反算。</span></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id);
const M = JSON.parse($('model').textContent);

// ---- planter reference (model mm: x = sheet right, y = sheet up, z = up from SFL+14.75) ----
const PX0=2830.6, PX1=5668.2, PYN=3112.9, PYS=1312.9;
// faces: corner A (viewer's left) -> corner B (viewer's right), viewed from outside
const FACES = {
  S:{A:[PX0,PYS],B:[PX1,PYS],name:'長邊（近噴泉）'},
  N:{A:[PX1,PYN],B:[PX0,PYN],name:'長邊（近景觀牆）'},
  W:{A:[PX0,PYN],B:[PX0,PYS],name:'短邊（西）'},
  E:{A:[PX1,PYS],B:[PX1,PYN],name:'短邊（東）'},
};
const m2t = (x,y)=>new THREE.Vector3(x/1000,0,-y/1000);   // model plan mm -> three (m)

// ---- renderer ----
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.02,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x777766,1.4));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(3,8,4);scene.add(dl);

// ---- model ----
const GROUP_OF = n => {
  if (/Structural|Paving/.test(n)) return null;
  if (/Planter wall|Planter alum|cascade tray|Tray SS|tray support|Planter soil|Feature tree/.test(n)) return 'planter';
  if (/Water|Bubbler|Underwater/.test(n)) return 'water';
  if (/coping \/ kerb|Pool base|pump pit/.test(n)) return 'pool';
  if (/Feature wall|Pier|East wall/.test(n)) return 'walls';
  return 'ctx';
};
const EDGE_COL={planter:0xffd400,pool:0x00e5ff,water:0x66ccff,walls:0xff7ad9,ctx:0x9cff57};
const model=new THREE.Group(); scene.add(model);
const groups={planter:[],pool:[],water:[],walls:[],ctx:[]};
const fillMats=[];
for(const p of M.parts){
  const g=GROUP_OF(p.name); if(!g) continue;
  const geo=new THREE.BufferGeometry(); const v=new Float32Array(p.v.length);
  for(let i=0;i<p.v.length;i+=3){v[i]=p.v[i]/1000;v[i+1]=p.v[i+2]/1000;v[i+2]=-p.v[i+1]/1000;}
  geo.setAttribute('position',new THREE.BufferAttribute(v,3)); geo.setIndex(p.f); geo.computeVertexNormals();
  const c=M.mats[p.mat];
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(c[0],c[1],c[2]),transparent:true,opacity:0.55,depthWrite:false,side:THREE.DoubleSide,roughness:0.7});
  if(p.mat==='water'){mat.color.set(0x4fc3f7);}
  fillMats.push(mat);
  const mesh=new THREE.Mesh(geo,mat); mesh.renderOrder=1;
  const isTree=/canopy|trunk|Hedge/.test(p.name);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,35),new THREE.LineBasicMaterial({color:EDGE_COL[g],transparent:true,opacity:isTree?0.25:0.95}));
  edges.renderOrder=2;
  const holder=new THREE.Group(); holder.add(mesh); if(!/Bubbler|Underwater/.test(p.name)) holder.add(edges);
  holder.userData={edges}; model.add(holder); groups[g].push(holder);
}
// level offset: model z=0 is SFL +14.75
function applyGroupVis(){ for(const k of Object.keys(groups)){ const on=$( {planter:'gPlanter',pool:'gPool',water:'gWater',walls:'gWalls',ctx:'gCtx'}[k]).checked; groups[k].forEach(h=>h.visible=on);} }
['gPlanter','gPool','gWater','gWalls','gCtx'].forEach(id=>$(id).onchange=applyGroupVis); applyGroupVis();
$('op').oninput=e=>fillMats.forEach(m=>m.opacity=e.target.value/100);
$('edges').onchange=e=>model.traverse(o=>{if(o.isLineSegments)o.visible=e.target.checked;});

// ---- alignment state ----
let pts=[];            // recorded world points (Vector3)
let floorY=null;       // world Y of tapped floor
let aligned=false;
let adj={along:0,out:0,up:0,rot:0};   // fine-tune (m, m, m, deg)
let base=null;         // {corner:Vector3, dir:Vector3(unit, XZ), nrm:Vector3}

function faceRef(){ const f=FACES[$('face').value]; const A=m2t(...f.A), B=m2t(...f.B); return {A,B,len:A.distanceTo(B)}; }

function solve(){
  // P1,P2 on chosen face base; P3 on the LEFT adjacent face base
  const [p1,p2,p3]=pts; const y=floorY;
  const P1=new THREE.Vector3(p1.x,y,p1.z),P2=new THREE.Vector3(p2.x,y,p2.z),P3=new THREE.Vector3(p3.x,y,p3.z);
  const dir=P2.clone().sub(P1).setY(0).normalize();
  // make dir point viewer-left -> viewer-right: P3 is on the left face, so corner A is on P3's side
  const t3=P3.clone().sub(P1).dot(dir);
  const mid=(0+P2.clone().sub(P1).dot(dir))/2;
  if(t3>mid) dir.negate();
  const corner=P1.clone().add(dir.clone().multiplyScalar(P3.clone().sub(P1).dot(dir)));
  // outward normal: away from the planter. P3 lies on the side face, which is inside the planter footprint direction
  let nrm=new THREE.Vector3(-dir.z,0,dir.x);
  // the planter body is on the side where camera is NOT; use camera position at tap time
  const toCam=camPosAtTap.clone().setY(y).sub(corner);
  if(nrm.dot(toCam)<0) nrm.negate();
  base={corner,dir,nrm};
  aligned=true; applyPose();
  // optional measured length
  updateMeas();
}
let camPosAtTap=new THREE.Vector3();

function applyPose(){
  if(!base) return;
  const ref=faceRef();
  const mDir=ref.B.clone().sub(ref.A).normalize();
  const rot=THREE.MathUtils.degToRad(adj.rot);
  const dir=base.dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0),rot);
  const phi=Math.atan2(-dir.z,dir.x)-Math.atan2(-mDir.z,mDir.x);
  model.rotation.set(0,phi,0);
  const lvl=parseFloat($('lvl').value);
  const corner=base.corner.clone()
     .add(base.dir.clone().multiplyScalar(adj.along))
     .add(base.nrm.clone().multiplyScalar(adj.out));
  const Arot=ref.A.clone().applyAxisAngle(new THREE.Vector3(0,1,0),phi);
  model.position.set(corner.x-Arot.x, floorY-(lvl-14.75)+adj.up, corner.z-Arot.z);
  model.visible=true;
  $('offs').textContent=`沿牆 ${(adj.along*1000).toFixed(0)} mm · 向外 ${(adj.out*1000).toFixed(0)} mm · 高度 ${(adj.up*1000).toFixed(0)} mm · 轉角 ${adj.rot.toFixed(1)}°`;
}
function updateMeas(){
  const el=$('meas');
  if(pts.length>=4&&base){
    const P4=pts[3].clone().setY(floorY);
    const L=P4.clone().sub(base.corner).dot(base.dir);
    const d=faceRef().len;
    el.style.display='block';
    el.textContent=`實測牆長 ${(L*1000).toFixed(0)} mm ／ 設計 ${(d*1000).toFixed(0)} mm ／ 差 ${((L-d)*1000).toFixed(0)} mm（手機 AR 精度約 ±20–50 mm）`;
  } else el.style.display='none';
}
const STEPS=[
  ()=>['點 1：對準所選牆面的牆腳（左邊位置）','十字對準牆身與地面相交的線，按「記錄此點」或點擊畫面。'],
  ()=>['點 2：同一牆面牆腳，靠右邊、盡量遠離點 1','兩點相隔越遠，方向越準。'],
  ()=>['點 3：左邊短邊的牆腳（任何一點）','程式會用它求出圓角背後的實際角位。'],
  ()=>['已對位。可選：點 4 = 右邊短邊牆腳，量度實際牆長','用下方按鈕微調；黃線 = 花槽及托盤，青線 = 池邊。'],
  ()=>['已對位，並已量度牆長','如有偏差，用微調對準黃色輪廓線與實物。'],
];
function refreshText(){ const i=Math.min(pts.length,4); const [a,b]=STEPS[i](); $('step').textContent=a; $('sub').textContent=b+`（對位面：${FACES[$('face').value].name}）`; $('fine').classList.toggle('hide',!aligned); }

function record(){
  if(!reticle.visible){ $('sub').textContent='未偵測到地面，請慢慢移動手機掃描地面。'; return; }
  const p=new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  if(pts.length===0) floorY=p.y; else floorY=(floorY*pts.length+p.y)/(pts.length+1);
  pts.push(p);
  camPosAtTap.setFromMatrixPosition(camera.matrixWorld);
  addMarker(p, pts.length);
  if(pts.length===3) solve();
  if(pts.length===4) updateMeas();
  if(pts.length>4){ pts.pop(); removeMarker(); }
  refreshText();
}
const markers=[];
function addMarker(p,n){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.025,12,8),new THREE.MeshBasicMaterial({color:[0,0xff4d4d,0x4dff88,0x4da6ff,0xffd400][n]})); m.position.copy(p); scene.add(m); markers.push(m);}
function removeMarker(){ const m=markers.pop(); if(m) scene.remove(m); }
$('tapBtn').onclick=record;
$('undoBtn').onclick=()=>{ if(!pts.length) return; pts.pop(); removeMarker(); if(pts.length<3){aligned=false;base=null;model.visible=false;} else {solve();} updateMeas(); refreshText(); };
$('resetBtn').onclick=()=>{ pts=[]; while(markers.length) removeMarker(); aligned=false; base=null; adj={along:0,out:0,up:0,rot:0}; model.visible=false; updateMeas(); refreshText(); };
$('face').onchange=()=>{ if(pts.length>=3) solve(); refreshText(); };
$('lvl').onchange=applyPose;
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
  const s=parseFloat($('stepSize').value), a=parseFloat($('angSize').value);
  ({L:()=>adj.along-=s,R:()=>adj.along+=s,F:()=>adj.out+=s,B:()=>adj.out-=s,U:()=>adj.up+=s,D:()=>adj.up-=s,CCW:()=>adj.rot+=a,CW:()=>adj.rot-=a})[b.dataset.n]();
  applyPose();
});

// ---- reticle & hit test ----
const reticle=new THREE.Mesh(new THREE.RingGeometry(0.05,0.07,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));
reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);
let hitSource=null, session=null;

async function startAR(){
  try{
    session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test','dom-overlay'],domOverlay:{root:$('ui')}});
  }catch(e){ $('support').textContent='無法啟動 AR：'+e.message; return; }
  $('start').classList.add('hide'); $('ui').classList.remove('hide');
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  const viewer=await session.requestReferenceSpace('viewer');
  hitSource=await session.requestHitTestSource({space:viewer});
  // taps on the camera view (not on the panels) record a point
  $('ui').addEventListener('beforexrselect',e=>{ if(e.target.closest('.card')) e.preventDefault(); });
  session.addEventListener('select',()=>record());
  session.addEventListener('end',()=>{ hitSource=null; session=null; $('start').classList.remove('hide'); $('ui').classList.add('hide'); });
  model.visible=false; refreshText();
}
$('exitBtn').onclick=()=>{ if(session) session.end(); else location.reload(); };

renderer.setAnimationLoop((t,frame)=>{
  if(frame&&hitSource){
    const ref=renderer.xr.getReferenceSpace();
    const hits=frame.getHitTestResults(hitSource);
    if(hits.length){ const pose=hits[0].getPose(ref); reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix); }
    else reticle.visible=false;
  }
  if(controls) controls.update();
  renderer.render(scene,camera);
});

// ---- 3D preview (no AR) ----
let controls=null;
function preview(){
  $('start').classList.add('hide');
  scene.background=new THREE.Color(0x1d232a);
  ['gWater','gWalls','gCtx'].forEach(id=>$(id).checked=true); applyGroupVis();
  const ref=m2t((PX0+PX1)/2,(PYN+PYS)/2);
  camera.position.set(ref.x-9,5,ref.z+11); controls=new OrbitControls(camera,canvas); controls.target.set(ref.x,0.6,ref.z);
  const grid=new THREE.GridHelper(30,30,0x445566,0x2a3440); grid.position.set(ref.x,0,ref.z); scene.add(grid);
  $('ui').classList.remove('hide'); $('cross').classList.add('hide');
  $('step').textContent='3D 預覽（非 AR）'; $('sub').textContent='用 Android Chrome 開啟此頁才可在現場對位。黃線 = 花槽及托盤，青線 = 池邊。';
  $('tapBtn').disabled=true;
}
$('previewBtn').onclick=preview;
$('startBtn').onclick=startAR;
(async()=>{
  const ok = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){ $('startBtn').disabled=true; $('startBtn').style.opacity=.4; $('support').textContent='此瀏覽器不支援 WebXR AR（需 Android Chrome + ARCore，並以 https 開啟）。'; }
})();
function resize(){ if(renderer.xr.isPresenting) return; renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
</script>
